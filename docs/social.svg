<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#1c2333"/>

  <text x="72" y="176" fill="#f5f7fb" font-size="66" font-weight="bold">Prompt Deck</text>
  <rect x="74" y="198" width="128" height="6" rx="3" fill="#f5c542"/>
  <text x="72" y="268" fill="#c8d0e0" font-size="27">Stage your next prompt.</text>
  <text x="72" y="304" fill="#c8d0e0" font-size="27">Then hit Enter yourself.</text>

  <circle cx="78" cy="372" r="4" fill="#f5c542"/>
  <text x="98" y="378" fill="#9aa5b8" font-size="19">File paths, snippets, screenshots, long drafts</text>
  <circle cx="78" cy="414" r="4" fill="#f5c542"/>
  <text x="98" y="420" fill="#9aa5b8" font-size="19">Claude Code, OpenCode, Codex - anything in Herdr</text>
  <circle cx="78" cy="456" r="4" fill="#f5c542"/>
  <text x="98" y="462" fill="#9aa5b8" font-size="19">Nothing auto-submits - you press Enter</text>

  <text x="72" y="590" fill="#7fd3f7" font-size="19">github.com/matdac12/herdr-prompt-deck</text>
  <text x="72" y="616" fill="#5b6577" font-size="15">a herdr plugin - rust - windows / macos / linux</text>

  <!-- deck bar -->
  <rect x="676" y="118" width="548" height="168" rx="14" fill="#111624" stroke="#232a3d" filter="url(#soft)"/>
  <text x="700" y="158" fill="#c8d0e0" font-size="15">1 Files</text>
  <text x="792" y="158" fill="#c8d0e0" font-size="15">2 Snippets</text>
  <rect x="944" y="140" width="92" height="26" rx="7" fill="#f5c542"/>
  <text x="960" y="159" fill="#0b0e17" font-size="15" font-weight="bold">3 Editor</text>
  <text x="1200" y="158" fill="#7fd3f7" font-size="14" text-anchor="end">target: claude</text>

  <text x="700" y="196" fill="#6b7688" font-size="14">filter</text>
  <text x="768" y="196" fill="#e6ebf5" font-size="14">rev</text>
  <text x="794" y="196" fill="#f5c542" font-size="14">_</text>

  <rect x="690" y="210" width="520" height="30" rx="7" fill="#f5c542"/>
  <text x="708" y="231" fill="#0b0e17" font-size="14" font-weight="bold">review-diff</text>
  <text x="856" y="231" fill="#0b0e17" font-size="14">list only actionable issues.</text>

  <text x="708" y="268" fill="#6b7688" font-size="14">fix-tests</text>
  <text x="828" y="268" fill="#576173" font-size="14">fix the failing tests.</text>

  <!-- floating window -->
  <rect x="720" y="322" width="504" height="262" rx="14" fill="#111624" stroke="#2a3142" filter="url(#soft)"/>
  <line x1="720" y1="362" x2="1224" y2="362" stroke="#232a3d"/>
  <circle cx="746" cy="342" r="5" fill="#3a4357"/>
  <circle cx="764" cy="342" r="5" fill="#3a4357"/>
  <circle cx="782" cy="342" r="5" fill="#3a4357"/>
  <text x="806" y="347" fill="#9aa5b8" font-size="13">scratchpad  -  Ctrl+Enter sends</text>
  <rect x="1136" y="331" width="72" height="20" rx="10" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="1172" y="345" fill="#7fd3f7" font-size="10" text-anchor="middle">on top</text>

  <rect x="736" y="376" width="472" height="150" rx="8" fill="#0d1220" stroke="#232a3d"/>
  <text x="754" y="404" fill="#c8d0e0" font-size="14">Review src/main.rs and the diff.</text>
  <text x="754" y="426" fill="#c8d0e0" font-size="14">Focus on the bracket-paste path and</text>
  <text x="754" y="448" fill="#c8d0e0" font-size="14">anything that could submit early.</text>
  <text x="754" y="492" fill="#7ee787" font-size="14">...screenshots\shot-1789211664449.png</text>

  <rect x="736" y="540" width="200" height="32" rx="8" fill="#f5c542"/>
  <text x="836" y="561" fill="#0b0e17" font-size="13" font-weight="bold" text-anchor="middle">Send to agent  Ctrl+Enter</text>
  <rect x="948" y="540" width="164" height="32" rx="8" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="1030" y="561" fill="#c8d0e0" font-size="13" text-anchor="middle">Paste screenshot</text>
  <rect x="1124" y="540" width="84" height="32" rx="8" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="1166" y="561" fill="#c8d0e0" font-size="13" text-anchor="middle">Clear</text>
</svg>
