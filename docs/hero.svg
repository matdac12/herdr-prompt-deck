<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#0e1220"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="920" height="660" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="919" height="659" rx="18" fill="none" stroke="#1c2333"/>

  <!-- 1. The deck bar -->
  <text x="40" y="34" fill="#6b7688" font-size="12">prompt-deck  ·  a bottom bar for herdr</text>
  <rect x="40" y="44" width="840" height="196" rx="12" fill="#111624" stroke="#232a3d" filter="url(#soft)"/>

  <text x="64" y="82" fill="#c8d0e0" font-size="14">1 Files</text>
  <text x="152" y="82" fill="#c8d0e0" font-size="14">2 Snippets</text>
  <rect x="300" y="64" width="86" height="24" rx="7" fill="#f5c542"/>
  <text x="316" y="82" fill="#0b0e17" font-size="14" font-weight="bold">3 Editor</text>
  <text x="864" y="82" fill="#7fd3f7" font-size="13" text-anchor="end">target: claude</text>

  <text x="64" y="116" fill="#6b7688" font-size="13">filter</text>
  <text x="140" y="116" fill="#e6ebf5" font-size="13">rev</text>
  <text x="165" y="116" fill="#f5c542" font-size="13">_</text>

  <rect x="56" y="130" width="808" height="28" rx="7" fill="#f5c542"/>
  <text x="74" y="150" fill="#0b0e17" font-size="13" font-weight="bold">review-diff</text>
  <text x="236" y="150" fill="#0b0e17" font-size="13">Review the current diff and list only actionable issues.</text>

  <text x="74" y="186" fill="#9aa5b8" font-size="13">fix-tests</text>
  <text x="236" y="186" fill="#6b7688" font-size="13">Run the test suite, find failures, and fix them.</text>

  <text x="64" y="222" fill="#f5c542" font-size="12" font-weight="bold">type</text>
  <text x="104" y="222" fill="#6b7688" font-size="12">filter</text>
  <text x="164" y="222" fill="#f5c542" font-size="12" font-weight="bold">↑↓</text>
  <text x="188" y="222" fill="#6b7688" font-size="12">select</text>
  <text x="248" y="222" fill="#f5c542" font-size="12" font-weight="bold">↵</text>
  <text x="264" y="222" fill="#6b7688" font-size="12">insert</text>
  <text x="322" y="222" fill="#f5c542" font-size="12" font-weight="bold">ctrl+n</text>
  <text x="378" y="222" fill="#6b7688" font-size="12">new</text>
  <text x="420" y="222" fill="#f5c542" font-size="12" font-weight="bold">esc</text>
  <text x="452" y="222" fill="#6b7688" font-size="12">close</text>

  <!-- 2. The floating scratchpad -->
  <text x="140" y="282" fill="#6b7688" font-size="12">↵ opens the floating scratchpad  ·  always on top</text>
  <rect x="140" y="292" width="640" height="328" rx="12" fill="#111624" stroke="#2a3142" filter="url(#soft)"/>
  <line x1="140" y1="330" x2="780" y2="330" stroke="#232a3d"/>

  <circle cx="164" cy="311" r="5" fill="#3a4357"/>
  <circle cx="182" cy="311" r="5" fill="#3a4357"/>
  <circle cx="200" cy="311" r="5" fill="#3a4357"/>
  <text x="224" y="316" fill="#9aa5b8" font-size="12">Prompt Deck - scratchpad   (Ctrl+Enter sends)</text>
  <rect x="688" y="300" width="72" height="20" rx="10" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="724" y="314" fill="#7fd3f7" font-size="10" text-anchor="middle">on top</text>

  <rect x="156" y="344" width="608" height="212" rx="8" fill="#0d1220" stroke="#232a3d"/>
  <text x="174" y="372" fill="#c8d0e0" font-size="13">Review src/main.rs and the diff. Focus on the</text>
  <text x="174" y="394" fill="#c8d0e0" font-size="13">bracket-paste path and anything that could</text>
  <text x="174" y="416" fill="#c8d0e0" font-size="13">submit early.</text>
  <text x="174" y="460" fill="#7ee787" font-size="13">C:\Users\...\screenshots\shot-1789211664449.png</text>

  <rect x="156" y="568" width="184" height="34" rx="8" fill="#f5c542"/>
  <text x="248" y="590" fill="#0b0e17" font-size="12" font-weight="bold" text-anchor="middle">Send to agent  (Ctrl+Enter)</text>

  <rect x="350" y="568" width="178" height="34" rx="8" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="439" y="590" fill="#c8d0e0" font-size="12" text-anchor="middle">Paste screenshot  (Ctrl+V)</text>

  <rect x="538" y="568" width="140" height="34" rx="8" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="608" y="590" fill="#c8d0e0" font-size="12" text-anchor="middle">Insert file...</text>

  <rect x="688" y="568" width="76" height="34" rx="8" fill="#1c2740" stroke="#2f3d5c"/>
  <text x="726" y="590" fill="#c8d0e0" font-size="12" text-anchor="middle">Clear</text>
</svg>
