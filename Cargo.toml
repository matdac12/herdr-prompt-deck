[package]
name = "prompt-deck"
version = "0.1.0"
edition = "2024"
description = "A bottom prompt bar for herdr: insert file paths, snippets, and scratch text into the focused agent."
license = "MIT"

[[bin]]
name = "prompt-deck"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
