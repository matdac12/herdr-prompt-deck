[package]
name = "prompt-deck"
version = "0.1.0"
edition = "2024"
description = "A bottom prompt bar for herdr: insert file paths, snippets, and scratch text into the focused agent."
license = "MIT"

[[bin]]
name = "prompt-deck"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Native file dialogs on Windows/macOS. On Linux, rfd's portal backend pulls in
# wayland/gtk build dependencies, so we shell out to zenity/kdialog there instead
# and keep the Linux binary free of system libraries.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = "0.15"

# Win32 APIs for the native always-on-top scratchpad window (`prompt-deck window`).
# `png` encodes a clipboard screenshot (CF_DIB) saved to a file.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
png = "0.17"
